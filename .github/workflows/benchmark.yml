name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_MONGODB__URI: mongodb://localhost:27017
      APP_MONGODB__DATABASE: learning_japanese
      APP_OAUTH__JWT_SECRET: bench-secret-key-for-ci-testing
      APP_SERVER__PORT: "8080"
      APP_SERVER__ENV: production
      APP_SERVER__ENABLE_SWAGGER: "false"
      APP_GRPC__SEARCH_ENGINE_ADDR: ""
      GIN_MODE: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: swag init -g cmd/api/main.go -o docs

      - name: Build API server
        run: go build -o ./api-server ./cmd/api

      - name: Seed test data
        run: docker run --rm --network host -v ${{ github.workspace }}/benchmark/seed/seed.js:/seed.js mongo:7 mongosh mongodb://localhost:27017/learning_japanese /seed.js

      - name: Create results directory
        run: mkdir -p benchmark/results

      - name: Start API server
        run: |
          nohup ./api-server > benchmark/results/server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30 seconds"
              cat benchmark/results/server.log
              exit 1
            fi
            sleep 1
          done

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # ------------------------------------------------------------------
      # Smoke tests — quick validation that nothing crashes
      # ------------------------------------------------------------------
      - name: "Smoke test: health endpoint"
        run: |
          k6 run \
            --env K6_SCENARIO=smoke \
            --env BASE_URL=http://localhost:8080 \
            benchmark/k6/health.js

      - name: "Smoke test: API endpoints"
        run: |
          k6 run \
            --env K6_SCENARIO=smoke \
            --env BASE_URL=http://localhost:8080 \
            --env JWT_SECRET=bench-secret-key-for-ci-testing \
            benchmark/k6/api_endpoints.js

      # ------------------------------------------------------------------
      # Load tests — full performance measurement
      # ------------------------------------------------------------------
      - name: "Load test: health endpoint"
        run: |
          k6 run \
            --env K6_SCENARIO=load \
            --env BASE_URL=http://localhost:8080 \
            --out json=benchmark/results/health.json \
            --summary-export=benchmark/results/health-summary.json \
            benchmark/k6/health.js

      - name: "Load test: API endpoints"
        run: |
          k6 run \
            --env K6_SCENARIO=load \
            --env BASE_URL=http://localhost:8080 \
            --env JWT_SECRET=bench-secret-key-for-ci-testing \
            --out json=benchmark/results/api.json \
            --summary-export=benchmark/results/api-summary.json \
            benchmark/k6/api_endpoints.js

      - name: "Stress test: API endpoints"
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env JWT_SECRET=bench-secret-key-for-ci-testing \
            --out json=benchmark/results/stress.json \
            --summary-export=benchmark/results/stress-summary.json \
            benchmark/k6/stress.js

      # ------------------------------------------------------------------
      # Results
      # ------------------------------------------------------------------
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let healthSummary = {};
            let apiSummary = {};
            let stressSummary = {};

            try {
              healthSummary = JSON.parse(fs.readFileSync('benchmark/results/health-summary.json', 'utf8'));
              apiSummary = JSON.parse(fs.readFileSync('benchmark/results/api-summary.json', 'utf8'));
              stressSummary = JSON.parse(fs.readFileSync('benchmark/results/stress-summary.json', 'utf8'));
            } catch (e) {
              console.log('Could not read summary files:', e.message);
              return;
            }

            const fmt = (v) => (v != null ? `${v.toFixed(2)}ms` : 'N/A');
            const fmtRate = (v) => (v != null ? v.toFixed(1) : 'N/A');
            const getMetric = (summary, name) => summary.metrics?.[name] || {};

            const healthDuration = getMetric(healthSummary, 'http_req_duration');
            const apiDuration = getMetric(apiSummary, 'http_req_duration');
            const stressDuration = getMetric(stressSummary, 'http_req_duration');
            const healthReqs = getMetric(healthSummary, 'http_reqs');
            const apiReqs = getMetric(apiSummary, 'http_reqs');
            const stressReqs = getMetric(stressSummary, 'http_reqs');
            const healthFailed = getMetric(healthSummary, 'http_req_failed');
            const apiFailed = getMetric(apiSummary, 'http_req_failed');
            const stressFailed = getMetric(stressSummary, 'http_req_failed');

            const body = [
              '## 📊 Benchmark Results',
              '',
              '| Metric | Health Check | API Endpoints | Stress Test |',
              '|--------|-------------|---------------|-------------|',
              `| **p50 Latency** | ${fmt(healthDuration.med)} | ${fmt(apiDuration.med)} | ${fmt(stressDuration.med)} |`,
              `| **p95 Latency** | ${fmt(healthDuration['p(95)'])} | ${fmt(apiDuration['p(95)'])} | ${fmt(stressDuration['p(95)'])} |`,
              `| **p90 Latency** | ${fmt(healthDuration['p(90)'])} | ${fmt(apiDuration['p(90)'])} | ${fmt(stressDuration['p(90)'])} |`,
              `| **Max Latency** | ${fmt(healthDuration.max)} | ${fmt(apiDuration.max)} | ${fmt(stressDuration.max)} |`,
              `| **Avg Latency** | ${fmt(healthDuration.avg)} | ${fmt(apiDuration.avg)} | ${fmt(stressDuration.avg)} |`,
              `| **Min Latency** | ${fmt(healthDuration.min)} | ${fmt(apiDuration.min)} | ${fmt(stressDuration.min)} |`,
              `| **Requests/sec** | ${fmtRate(healthReqs.rate)} | ${fmtRate(apiReqs.rate)} | ${fmtRate(stressReqs.rate)} |`,
              `| **Error Rate** | ${fmtRate(healthFailed.value != null ? healthFailed.value * 100 : 0)}% | ${fmtRate(apiFailed.value != null ? apiFailed.value * 100 : 0)}% | ${fmtRate(stressFailed.value != null ? stressFailed.value * 100 : 0)}% |`,
              '',
              '<details><summary>ℹ️ Test Configuration</summary>',
              '',
              '- **Health & API VUs**: 50 (constant)',
              '- **Duration**: 30s',
              '- **Stress VUs**: Ramps up to 200',
              '- **Health thresholds**: p95 < 200ms, error rate < 1%',
              '- **API thresholds**: p95 < 500ms, error rate < 1%',
              '- **Stress thresholds**: p95 < 1000ms, error rate < 5%',
              '',
              '</details>',
              '',
              '> 🤖 Generated by [k6](https://k6.io) benchmark suite',
            ].join('\n');

            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('📊 Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
