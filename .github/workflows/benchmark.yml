name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_MONGODB__URI: mongodb://localhost:27017
      APP_MONGODB__DATABASE: learning_japanese
      APP_OAUTH__JWT_SECRET: bench-secret-key-for-ci-testing
      APP_SERVER__PORT: "8080"
      APP_SERVER__ENV: production
      APP_SERVER__ENABLE_SWAGGER: "false"
      APP_GRPC__SEARCH_ENGINE_ADDR: ""
      GIN_MODE: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs
        run: swag init -g cmd/api/main.go -o docs

      - name: Build API server
        run: go build -o ./api-server ./cmd/api

      - name: Seed test data
        run: docker run --rm --network host -v ${{ github.workspace }}/benchmark/seed/seed.js:/seed.js mongo:7 mongosh mongodb://localhost:27017/learning_japanese /seed.js

      - name: Create results directory
        run: mkdir -p results

      - name: Start API server
        run: |
          nohup ./api-server > results/server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30 seconds"
              cat results/server.log
              exit 1
            fi
            sleep 1
          done

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # ------------------------------------------------------------------
      # Run Benchmarks
      # ------------------------------------------------------------------
      - name: "Run Benchmark Suite"
        run: ./scripts/benchmark.sh

      # ------------------------------------------------------------------
      # Results
      # ------------------------------------------------------------------
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '';
            try {
              body = fs.readFileSync('results/README.md', 'utf8');
              body += '\n\n> 🤖 Generated by [k6](https://k6.io) benchmark suite';
            } catch (e) {
              console.log('Could not read README file:', e.message);
              return;
            }

            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Benchmark Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
