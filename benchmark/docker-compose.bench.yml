version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    build:
      context: ./seed
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      APP_MONGODB__URI: mongodb://mongo:27017
      APP_MONGODB__DATABASE: learning_japanese
      APP_OAUTH__JWT_SECRET: bench-secret-key-for-ci-testing
      APP_SERVER__PORT: "8080"
      APP_SERVER__ENV: production
      APP_SERVER__ENABLE_SWAGGER: "false"
      APP_GRPC__SEARCH_ENGINE_ADDR: ""
      GIN_MODE: release
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
